server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/items-assigner?useSSL=false&allowPublicKeyRetrieval=true&useAffectedRows=true
    username: root
    password: Aa1341512355
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: MyHikariCP
  application:
    name: product-service
  data:
    redis:
      host: localhost
      port: 6379
      database: 3
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    sentinel:
      transport:
        dashboard: localhost:8090
mybatis-plus:
  type-aliases-package: com.wddyxd.productservice.pojo
#eureka:
#  client:
#    service-url:
#      defaultZone: http://localhost:10086/eureka/
logging:
  config: classpath:logback-dev.xml
feign:
  sentinel:
    enabled: true
seata:
  enabled: true
  data-source-proxy-mode: AT
  application-id: product-service
  tx-service-group: seata-group  # 仅保留事务组名即可
  undo:
    log:
      parser: jackson # 替换为 jackson 解析器，避免 Protostuff 依赖问题
    serializer: jackson # 全局序列化改为 jackson
    client:
      undo:
        logSerialization: jackson
  registry:
    type: nacos
    nacos:
      server-addr: 127.0.0.1:8848
      namespace: ""
      group: DEFAULT_GROUP
      application: seata-server
      cluster: default
  config:
    type: nacos
    nacos:
      server-addr: 127.0.0.1:8848
      namespace: ""
      group: SEATA_GROUP  # 项目端也要指定读取SEATA_GROUP的配置
      dataId: seataServer.properties